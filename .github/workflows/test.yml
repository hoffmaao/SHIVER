name: Test client

# The timeseries extraction now runs in the browser, so its numerical
# behaviour is only guarded by these tests. They run on every push and pull
# request, and the deploy workflow waits for them before publishing.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: |
          cd client
          npm install

      # These run entirely offline against recorded fixtures, so a Source
      # Cooperative or backend outage cannot turn the build red. The live
      # parity tests are opt-in via SHIVER_LIVE_TESTS=1.
      - name: Unit and parity tests
        run: |
          cd client
          npm test

      - name: Build
        env:
          VITE_API_URL: https://shiver.shef.ac.uk
        run: |
          cd client
          npm run build
